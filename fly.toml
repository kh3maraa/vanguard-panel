# fly.toml app configuration file generated for vanguard-panel on 2026-08-02T22:59:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vanguard-panel'
primary_region = 'cdg'

[build]

[env]
  DB_PATH = '/data/vanguard.db'
  FILES_DIR = '/data/files'
  PORT = '8080'

[[mounts]]
  source = 'vanguard_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
