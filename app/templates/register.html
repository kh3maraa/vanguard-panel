{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block auth %}
<div class="auth-shell">
  <div class="auth-card">
    <img class="auth-logo" src="{{ url_for('static', filename='logo.png') }}" alt="Vanguard">
    <h1 class="auth-title">Vanguard<span class="dot">.</span></h1>
    <p class="auth-subtitle">Créez le compte administrateur.</p>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{cat}}">{{m}}</div>{% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input name="username" placeholder="Choisissez un nom d'utilisateur" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input name="password" type="password" placeholder="Minimum 8 caractères" required minlength="8">
        </div>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input name="password2" type="password" placeholder="Retapez le mot de passe" required minlength="8">
        </div>
      </div>

      <button class="btn full" type="submit">Créer le compte</button>
    </form>

    <p class="auth-footer">
      Déjà un compte ? <a href="{{ url_for('auth.login') }}">Se connecter</a>
    </p>
  </div>
</div>
{% endblock %}
